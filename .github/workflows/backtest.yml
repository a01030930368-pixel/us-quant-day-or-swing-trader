# 실제 가격 데이터로 스윙 후보 전략을 백테스트합니다.
# GitHub 웹에서 Actions 탭 -> backtest -> Run workflow 를 누르거나, PR이 올라오면 자동으로 돕니다.
# 결과는 실행 화면의 Summary와 첨부파일(swing-report)에 남습니다.
name: backtest
on:
  pull_request:
  workflow_dispatch:
    inputs:
      start:
        description: "백테스트 시작일"
        default: "2010-01-01"
      split:
        description: "검증(OOS) 시작일"
        default: "2018-01-01"
      cost_bps:
        description: "편도 거래비용 (bp)"
        default: "25"
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 대형주
        run: >
          python scripts/run_backtest.py --universe large --start ${{ inputs.start || '2010-01-01' }}
          --split ${{ inputs.split || '2018-01-01' }} --cost-bps ${{ inputs.cost_bps || '25' }}
      - name: 대형주 + 중형주
        run: >
          python scripts/run_backtest.py --universe all --start ${{ inputs.start || '2010-01-01' }}
          --split ${{ inputs.split || '2018-01-01' }} --cost-bps ${{ inputs.cost_bps || '25' }}
      - name: 전설 2그룹 (대형주 + 중형주)
        run: >
          python scripts/run_backtest.py --set legends2 --universe all --start ${{ inputs.start || '2010-01-01' }}
          --split ${{ inputs.split || '2018-01-01' }} --cost-bps ${{ inputs.cost_bps || '25' }}
      - name: 와인스타인·다바스 다듬기 (대형주 + 중형주)
        run: >
          python scripts/run_backtest.py --set refine --universe all --start ${{ inputs.start || '2010-01-01' }}
          --split ${{ inputs.split || '2018-01-01' }} --cost-bps ${{ inputs.cost_bps || '25' }}
      - name: 전설 1·2그룹 (소형주)
        run: >
          python scripts/run_backtest.py --set legends_all --universe small --start ${{ inputs.start || '2010-01-01' }}
          --split ${{ inputs.split || '2018-01-01' }} --cost-bps ${{ inputs.cost_bps || '25' }}
      - name: 전설 규칙 + 실적 조건 (대형주 + 중형주)
        run: >
          python scripts/run_backtest.py --set earnings --universe all --start ${{ inputs.start || '2010-01-01' }}
          --split ${{ inputs.split || '2018-01-01' }} --cost-bps ${{ inputs.cost_bps || '25' }}
      - name: 오닐·미너비니 + 실적 조건 (S&P 1500)
        run: >
          python scripts/run_backtest.py --set earnings_wide --universe sp1500 --start ${{ inputs.start || '2010-01-01' }}
          --split ${{ inputs.split || '2018-01-01' }} --cost-bps ${{ inputs.cost_bps || '25' }}
      - name: 실적 서프라이즈 후 추세 PEAD (S&P 1500)
        run: >
          python scripts/run_backtest.py --set pead --universe sp1500 --start ${{ inputs.start || '2010-01-01' }}
          --split ${{ inputs.split || '2018-01-01' }} --cost-bps ${{ inputs.cost_bps || '25' }}
      - name: 단기 과매도 반등 (S&P 1500)
        run: >
          python scripts/run_backtest.py --set reversion --universe sp1500 --start ${{ inputs.start || '2010-01-01' }}
          --split ${{ inputs.split || '2018-01-01' }} --cost-bps ${{ inputs.cost_bps || '25' }}
      - name: 총이익률 장기 보유 (S&P 1500)
        run: >
          python scripts/run_backtest.py --set quality --universe sp1500 --start ${{ inputs.start || '2010-01-01' }}
          --split ${{ inputs.split || '2018-01-01' }} --cost-bps ${{ inputs.cost_bps || '25' }}
      - name: 실적 발표일 기준 서프라이즈 (S&P 1500)
        run: >
          python scripts/run_backtest.py --set announce --universe sp1500 --start ${{ inputs.start || '2010-01-01' }}
          --split ${{ inputs.split || '2018-01-01' }} --cost-bps ${{ inputs.cost_bps || '25' }}
      - name: 내부자 매수 따라가기 (S&P 1500)
        run: >
          python scripts/run_backtest.py --set insider --universe sp1500 --start ${{ inputs.start || '2010-01-01' }}
          --split ${{ inputs.split || '2018-01-01' }} --cost-bps ${{ inputs.cost_bps || '25' }}
      - name: 여러 전략 합치기 (S&P 1500)
        run: >
          python scripts/run_backtest.py --set blend --universe sp1500 --start ${{ inputs.start || '2010-01-01' }}
          --split ${{ inputs.split || '2018-01-01' }} --cost-bps ${{ inputs.cost_bps || '25' }}
      - name: 하수구 돌파 (S&P 1500)
        run: >
          python scripts/run_backtest.py --set sewer --universe sp1500 --start ${{ inputs.start || '2010-01-01' }}
          --split ${{ inputs.split || '2018-01-01' }} --cost-bps ${{ inputs.cost_bps || '25' }}
      - name: 하수구 돌파 (소형주)
        run: >
          python scripts/run_backtest.py --set sewer --universe small --start ${{ inputs.start || '2010-01-01' }}
          --split ${{ inputs.split || '2018-01-01' }} --cost-bps ${{ inputs.cost_bps || '25' }}
      - name: 유튜브 눌림목 매매 (S&P 1500)
        run: >
          python scripts/run_backtest.py --set pullback_yt --universe sp1500 --start ${{ inputs.start || '2010-01-01' }}
          --split ${{ inputs.split || '2018-01-01' }} --cost-bps ${{ inputs.cost_bps || '25' }}
      - name: 유튜브 폴 튜더 존스식 변곡점 돌파 (S&P 1500)
        run: >
          python scripts/run_backtest.py --set ptj --universe sp1500 --start ${{ inputs.start || '2010-01-01' }}
          --split ${{ inputs.split || '2018-01-01' }} --cost-bps ${{ inputs.cost_bps || '25' }}
      - run: >
          cat reports/swing_report_ptj_sp1500.md reports/swing_report_pullback_yt_sp1500.md reports/swing_report_sewer_sp1500.md reports/swing_report_sewer_small.md reports/swing_report_blend_sp1500.md reports/swing_report_insider_sp1500.md reports/swing_report_announce_sp1500.md reports/swing_report_quality_sp1500.md reports/swing_report_reversion_sp1500.md reports/swing_report_pead_sp1500.md reports/swing_report_large.md reports/swing_report_all.md
          reports/swing_report_legends2_all.md reports/swing_report_refine_all.md
          reports/swing_report_legends_all_small.md reports/swing_report_earnings_all.md
          reports/swing_report_earnings_wide_sp1500.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: swing-report
          path: reports/
