# 데이트레이딩 규칙서 b10~b15 백테스트 (급등주·갭 종목 장중 매매) (무료 1분봉 mito0o852/OHLCV-1m, 2018-01 ~ 2026-03).
# 1) prep: 해마다 월 파일을 받아 여섯 규칙서가 함께 쓰는 후보 종목-날짜의 1분봉과 하루 표를 뽑는다. 캐시에 남긴다.
# 1-2) sec: SEC 공시에서 실적 발표(8-K 2.02) 시각을 모은다 (회사 주식 구분과 실적일 변형에 필요).
# 2) backtest: 규칙서마다 따로 계산한다. 결과는 Summary와 첨부파일(bNN-report)에 남는다.
name: daytrade-mom
on:
  push:
    branches: [claude/daytrade-b01-8wz04e]
    paths: [daytrade/prep_mom.py, daytrade/mom.py, scripts/run_mom.py, .github/workflows/daytrade-mom.yml]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
  prep:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        year: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: prep_mom
          key: mom-prep-${{ matrix.year }}-${{ hashFiles('daytrade/prep.py', 'daytrade/prep_b03.py', 'daytrade/prep_b04.py', 'daytrade/prep_mom.py') }}
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
      - if: steps.cache.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt
      - if: steps.cache.outputs.cache-hit != 'true'
        run: python daytrade/prep_mom.py --year ${{ matrix.year }} --out prep_mom
      - run: ls -la prep_mom
      - uses: actions/upload-artifact@v4
        with:
          name: mom-prep-${{ matrix.year }}
          path: prep_mom
          retention-days: 7
  sec:
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python daytrade/sec_earnings.py --out sec/earnings.parquet
      - uses: actions/upload-artifact@v4
        with:
          name: mom-prep-sec
          path: sec
          retention-days: 7
  backtest:
    needs: [prep, sec]
    if: ${{ !cancelled() && needs.prep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        rule: [b10, b11, b12, b13, b14, b15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: mom-prep-*
          path: prep_mom
          merge-multiple: true
      - run: python scripts/run_mom.py --prep prep_mom --rule ${{ matrix.rule }} --out reports/${{ matrix.rule }}
      - run: cat reports/${{ matrix.rule }}/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rule }}-report
          path: reports/${{ matrix.rule }}
