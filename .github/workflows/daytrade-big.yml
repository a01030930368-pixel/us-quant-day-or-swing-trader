# 데이트레이딩 규칙서 b19 (20% 넘는 갭 첫 1분 매수), b20 (장중 8-K 공시 직후 급등), b24 (마감 30분 낙폭과대 반등)
# (무료 1분봉 mito0o852/OHLCV-1m, 1993-01 ~ 2026-03).
# 1) sec: SEC 공시 정리 (회사 주식 구분, 실적일, 장중 8-K 접수 시각)
# 2) prep: 해마다 월 파일을 받아 세 규칙서의 후보 종목-날짜 1분봉을 뽑는다. 캐시에 남긴다.
# 3) backtest: 규칙서마다 따로. 결과는 Summary와 첨부파일(bNN-report)에 남는다.
name: daytrade-big
on:
  push:
    branches: [claude/daytrade-b01-8wz04e]
    paths: [daytrade/prep_big.py, scripts/run_big.py, .github/workflows/daytrade-big.yml]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
  sec:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python daytrade/sec_filings.py --out sec
      - uses: actions/upload-artifact@v4
        with:
          name: big-sec
          path: sec
          retention-days: 7
  prep:
    needs: sec
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        year: [1993, 1994, 1995, 1996, 1997, 1998, 1999, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009,
               2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: prep_big
          key: big-prep-${{ matrix.year }}-${{ hashFiles('daytrade/prep.py', 'daytrade/prep_b03.py', 'daytrade/prep_big.py') }}
      - uses: actions/download-artifact@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          name: big-sec
          path: sec
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
      - if: steps.cache.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt
      - if: steps.cache.outputs.cache-hit != 'true'
        run: python daytrade/prep_big.py --year ${{ matrix.year }} --sec sec/8k.parquet --out prep_big
      - run: ls -la prep_big
      - uses: actions/upload-artifact@v4
        with:
          name: big-prep-${{ matrix.year }}
          path: prep_big
          retention-days: 7
  backtest:
    needs: [sec, prep]
    if: ${{ !cancelled() && needs.prep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        rule: [b19, b20, b24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: big-prep-*
          path: prep_big
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: big-sec
          path: sec
      - run: python scripts/run_big.py --prep prep_big --sec sec --rule ${{ matrix.rule }} --out reports/${{ matrix.rule }}
      - run: cat reports/${{ matrix.rule }}/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rule }}-report
          path: reports/${{ matrix.rule }}
